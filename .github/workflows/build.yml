name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # Caching ~/.m2 keeps the Paper API snapshot from being re-fetched
          # on every run.
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Upload artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
